name: Smoke test (reusable)

on:
  workflow_call:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Lint
        run: npm ci && npm run lint
        working-directory: .
      - name: Check file lists
        run: npm run test:files
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Smoke only, on purpose: this job gates releases, so the integration and
      # experimental comments suites run locally via ./test.sh instead.
      - name: Run smoke test
        run: xvfb-run --auto-servernum npm run test:smoke
