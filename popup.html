<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Dislike Count for LeetCode</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            font-size: 13px;
            margin: 0;
            padding: 12px;
            width: min-content;
            min-width: 260px;
        }
        /* Two columns: the checkbox, then the label text with the hint under it. */
        .option {
            display: grid;
            grid-template-columns: auto 1fr;
            column-gap: 8px;
        }
        label {
            display: grid;
            grid-template-columns: subgrid;
            grid-column: 1 / -1;
            align-items: center;
            cursor: pointer;
            white-space: nowrap;
        }
        input {
            margin: 0;
        }
        .hint {
            grid-column: 2;
            margin: 4px 0 0;
            color: #666;
            white-space: nowrap;
        }
        @media (prefers-color-scheme: dark) {
            .hint {
                color: #aaa;
            }
        }
    </style>
</head>
<body>
    <div class="option">
        <label>
            <input type="checkbox" id="comment-counts" aria-describedby="comment-counts-hint">
            <span>Show dislike counts on comments</span>
        </label>
        <p class="hint" id="comment-counts-hint">
            If LeetCode starts rate-limiting you,<br>
            switch this option off.
        </p>
    </div>
    <script src="popup.js"></script>
</body>
</html>
